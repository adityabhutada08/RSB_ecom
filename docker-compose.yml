services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      # Database name to match your Django settings
      - POSTGRES_DB=${DB_NAME:-rsb_db} 
      - POSTGRES_USER=${DB_USER:-rsb_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-rsb_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rsb_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    # FINAL FIX: Explicitly use the shell interpreter to run the script. 
    # This bypasses permission issues from host volume mounting (sh: 1: Permission denied).
    command: /bin/sh /app/start.sh
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    depends_on:
      - web
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume: